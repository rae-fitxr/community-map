<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitXR Community — Global Distribution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;700i;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #2F2E2B;             /* warm black */
    --surface: #25241F;
    --border: #3D3C39;
    --text: #FFFFFF;
    --text-dim: #A8A6A0;
    --primary: #139CDB;        /* primary blue */
    --primary-deep: #0078E9;
    --primary-light: #61BDE7;
    --neon: #E4FE5B;           /* neon green */
    --pink: #FF2E60;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', 'Inter', system-ui, -apple-system, sans-serif;
    font-weight: 600;
    font-size: 15px;
    line-height: 1.45;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 1fr 380px;
    height: 100vh;
  }
  #map {
    background: var(--bg);
    height: 100vh;
    width: 100%;
  }
  .leaflet-container {
    background: var(--bg) !important;
    font-family: 'Barlow', 'Inter', system-ui, sans-serif !important;
    font-weight: 600 !important;
  }
  .leaflet-control-attribution {
    background: rgba(47, 46, 43, 0.85) !important;
    color: var(--text-dim) !important;
    font-size: 10px !important;
    padding: 4px 10px !important;
    border: 1px solid var(--border) !important;
    border-radius: 999px !important;
  }
  .leaflet-control-attribution a {
    color: var(--primary-light) !important;
  }
  .leaflet-control-zoom {
    border: none !important;
  }
  .leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--text) !important;
    border: 1px solid var(--border) !important;
    font-weight: 700 !important;
    border-radius: 999px !important;
    margin-bottom: 6px !important;
    width: 32px !important;
    height: 32px !important;
    line-height: 32px !important;
  }
  .leaflet-control-zoom a:hover {
    background: var(--primary) !important;
    color: var(--text) !important;
    border-color: var(--primary) !important;
  }

  /* Dot styling — Primary Blue, Neon Green for highest density */
  .dot {
    background: var(--primary);
    border-radius: 50%;
    box-shadow:
      0 0 0 2px rgba(19, 156, 219, 0.3),
      0 0 24px rgba(19, 156, 219, 0.5);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .dot.dot-hot {
    background: var(--neon);
    box-shadow:
      0 0 0 2px rgba(228, 254, 91, 0.35),
      0 0 32px rgba(228, 254, 91, 0.6);
  }
  .dot:hover {
    transform: scale(1.35);
  }

  /* Side panel */
  .panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 36px 32px 40px;
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

  .panel-header {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .brand-mark {
    margin-bottom: 26px;
    height: 44px;
    display: flex;
    align-items: center;
  }
  .brand-mark img,
  .brand-mark svg {
    height: 44px;
    width: auto;
    display: block;
  }
  .title {
    font-family: 'Barlow', sans-serif;
    font-weight: 800;
    font-size: 38px;
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--text);
    text-transform: uppercase;
  }
  .title .accent {
    color: var(--primary-light);
    font-style: italic;
    font-weight: 700;
    text-transform: none;
    letter-spacing: -0.01em;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 14px;
    line-height: 1.5;
    font-weight: 600;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 36px;
  }
  .stat {
    padding: 18px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .stat-num {
    font-family: 'Barlow', sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
    letter-spacing: -0.02em;
    font-feature-settings: "tnum";
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    margin-top: 8px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  /* Country list */
  .country-list { list-style: none; }
  .country-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    column-gap: 12px;
    padding: 11px 0 9px;
    border-bottom: 1px solid var(--border);
  }
  .country-row:last-child { border-bottom: none; }
  .country-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .country-count {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    font-feature-settings: "tnum";
    font-variant-numeric: tabular-nums;
  }
  .country-bar {
    grid-column: 1 / -1;
    height: 3px;
    background: var(--primary);
    margin-top: 6px;
    border-radius: 999px;
  }
  .country-row.top .country-bar {
    background: var(--neon);
  }
  .country-row.top .country-name {
    color: var(--neon);
  }

  /* Tooltip */
  .leaflet-tooltip {
    background: var(--surface) !important;
    border: 1px solid var(--primary) !important;
    color: var(--text) !important;
    padding: 8px 12px !important;
    font-size: 12px !important;
    font-family: 'Barlow', sans-serif !important;
    font-weight: 600 !important;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4) !important;
    border-radius: 10px !important;
  }
  .leaflet-tooltip strong {
    color: var(--neon);
    font-weight: 700;
  }
  .leaflet-tooltip::before { display: none !important; }

  /* Footer / legend */
  .legend {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .legend-dot {
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-dot.small { width: 8px; height: 8px; background: var(--primary); }
  .legend-dot.large { width: 18px; height: 18px; background: var(--primary); }
  .legend-dot.hot { width: 18px; height: 18px; background: var(--neon); }

  /* Live indicator */
  .live-status {
    margin-top: 18px;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .live-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--neon);
    box-shadow: 0 0 10px var(--neon);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
  }

  /* Loading overlay */
  .loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    z-index: 1000;
    pointer-events: none;
  }
  .loading.hidden { display: none; }
  .loading-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--neon);
    margin: 0 3px;
    animation: bounce 1.4s ease-in-out infinite;
  }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-8px); opacity: 1; }
  }

  /* Error state */
  .error-msg {
    background: rgba(255, 46, 96, 0.1);
    border: 1px solid var(--pink);
    color: var(--text);
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 12px;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .error-msg strong { color: var(--pink); }

  /* Responsive */
  @media (max-width: 900px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto;
    }
    .panel {
      max-height: 50vh;
      border-left: none;
      border-top: 1px solid var(--border);
      padding: 24px 22px;
    }
    #map { height: 50vh; }
    .title { font-size: 28px; }
  }
</style>
</head>

      <h1 class="title">Where our<br/><span class="accent">community</span> moves.</h1>
      <p class="subtitle" id="subtitle">Loading…</p>
      <div class="live-status">
        <span class="live-pulse"></span>
        <span id="live-status-text">Live · updates hourly</span>
      </div>
    </div>

    <div id="error-container"></div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">Respondents</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-countries">—</div>
        <div class="stat-label">Countries</div>
      </div>
    </div>

    <div class="section-label">Distribution by Country</div>
    <ul class="country-list" id="country-list"></ul>

    <div class="legend">
      <div class="section-label">Map Legend</div>
      <div class="legend-row">
        <span class="legend-dot small"></span>
        <span>1 respondent</span>
      </div>
      <div class="legend-row">
        <span class="legend-dot large"></span>
        <span>Larger cluster (size scales with count)</span>
      </div>
      <div class="legend-row">
        <span class="legend-dot hot"></span>
        <span>Highest concentration cities</span>
      </div>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYb9RYYfx1RRgZlyhAHHGzJvTu0aFrsedzLcRZkFZ60W9SkbQsSnrVQDHaUfJM6fPNpM0gDVr7Cl4J/pub?gid=1231939629&single=true&output=csv';

// --- Init map ---
const map = L.map('map', {
  center: [30, 0],
  zoom: 2,
  minZoom: 2,
  maxZoom: 8,
  worldCopyJump: true,
  zoomControl: true,
  attributionControl: true,
});

// Dark basemap matching warm black
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
  attribution: '',
  subdomains: 'abcd',
  pane: 'shadowPane',
  opacity: 0.6
}).addTo(map);

// --- Fetch live data from Google Sheet ---
function loadData() {
  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data;
      const points = rows.map(r => {
        const lat = parseFloat(r['lat']);
        const lng = parseFloat(r['lng']);
        if (isNaN(lat) || isNaN(lng)) return null;

        // Helper: find a column by fuzzy-matching key (handles curly vs straight quotes, extra spaces)
        const findCol = (substring) => {
          const key = Object.keys(r).find(k =>
            k.replace(/[‘’'"]/g, '').replace(/\s+/g, ' ').toLowerCase().includes(substring.toLowerCase())
          );
          return key ? (r[key] || '').toString().trim() : '';
        };

        const mainCountry = findCol('which country are you based in');
        const otherCountry = findCol('if you selected') || findCol('which country');
        const country = (mainCountry === 'Other' && otherCountry) ? otherCountry : mainCountry;
        const city = findCol('which city');

        return { lat, lng, country, city };
      }).filter(p => p !== null);

      if (points.length === 0) {
        showError('No data available yet. Check back soon.');
        return;
      }
      renderMap(points);
    },
    error: function(err) {
      console.error(err);
      showError('Could not load community data. Please refresh in a moment.');
    }
  });
}

function showError(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-container').innerHTML =
    `<div class="error-msg"><strong>Heads up:</strong> ${msg}</div>`;
}

function renderMap(points) {
  // Hide loading
  document.getElementById('loading').classList.add('hidden');

  // --- Aggregate points (~11km grid) ---
  const grouped = {};
  points.forEach(p => {
    const key = `${p.lat.toFixed(1)}|${p.lng.toFixed(1)}`;
    if (!grouped[key]) {
      grouped[key] = { lat: p.lat, lng: p.lng, count: 0, cities: {}, country: p.country };
    }
    grouped[key].count++;
    grouped[key].cities[p.city] = (grouped[key].cities[p.city] || 0) + 1;
  });

  const grouped_arr = Object.values(grouped);
  const max_count = Math.max(...grouped_arr.map(g => g.count));
  const hot_threshold = Math.max(2, Math.ceil(max_count * 0.5));

  grouped_arr.forEach(g => {
    const size = 8 + (g.count / max_count) * 24;
    const opacity = 0.55 + (g.count / max_count) * 0.45;
    const isHot = g.count >= hot_threshold;

    const icon = L.divIcon({
      className: '',
      html: `<div class="dot ${isHot ? 'dot-hot' : ''}" style="width:${size}px;height:${size}px;opacity:${opacity}"></div>`,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2]
    });

    const marker = L.marker([g.lat, g.lng], { icon }).addTo(map);

    const cities = Object.entries(g.cities)
      .sort((a,b) => b[1] - a[1])
      .map(([c, n]) => n > 1 ? `${c} (${n})` : c)
      .join(', ');
    const label = `<strong>${g.count}</strong> ${g.count === 1 ? 'respondent' : 'respondents'} · ${cities}`;
    marker.bindTooltip(label, { direction: 'top', offset: [0, -size/2] });
  });

  // --- Country list ---
  const country_counts = {};
  points.forEach(p => {
    if (p.country) country_counts[p.country] = (country_counts[p.country] || 0) + 1;
  });
  const sorted_countries = Object.entries(country_counts).sort((a,b) => b[1] - a[1]);

  if (sorted_countries.length > 0) {
    const max_country = sorted_countries[0][1];
    const list = document.getElementById('country-list');
    list.innerHTML = '';
    sorted_countries.forEach(([country, n], i) => {
      const li = document.createElement('li');
      li.className = 'country-row' + (i < 2 ? ' top' : '');
      const pct = (n / max_country) * 100;
      li.innerHTML = `
        <span class="country-name">${country}</span>
        <span class="country-count">${n}</span>
        <div class="country-bar" style="width:${pct}%;"></div>
      `;
      list.appendChild(li);
    });
  }

  document.getElementById('stat-total').textContent = points.length;
  document.getElementById('stat-countries').textContent = Object.keys(country_counts).length;
  document.getElementById('subtitle').textContent =
    `${points.length} respondents across ${Object.keys(country_counts).length} ${Object.keys(country_counts).length === 1 ? 'country' : 'countries'}`;
}

loadData();
</script>
